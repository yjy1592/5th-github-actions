name: Multi Environment Test
on: workflow_dispatch

jobs:
  test:
    runs-on: matrix.os
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['16', '20']
        include: 
          - os: ubuntu-latest
            node: 20
            label: "권장"
        exclude:
          - os: windows-latest
            node: 16
    steps:
      - name: 환경 정보
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node: ${{ matrix.node }}"
          echo "Label: ${{ matrix.label }}"

      - name: 테스트 실행 시뮬레이션
        run: 
          echo "테스트 실행 - $RUNNER_OS, Node ${{ matrix.node }}"
    
