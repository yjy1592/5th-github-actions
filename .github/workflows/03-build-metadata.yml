name: Build Metadata Generator
on: workflow_dispatch

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: 메타데이터 생성
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BUILD_ID="build-${{ github.run_number }}-$SHORT_SHA"
          ACTOR_UPPER=$(echo "${{ github.actor }}" | tr 'a-z' 'A-Z')
          TIMESTAMP=$(date +%s)

          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "actor_upper=$ACTOR_UPPER" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: 메타데이터 출력
        run: |
          echo "=== 빌드 메타데이터 ==="
          Build ID: ${{ steps.meta.outputs.build_id }}
          Short SHA: ${{ steps.meta.outputs.short_sha }}
          Actor: ${{ steps.meta.outputs.actor_upper }}
          Timestamp: ${{ steps.meta.outputs.timestamp }}

      - name: Runner 환경 정보
        run: |
          OS: ${{ runner.os }}
          Arch: ${{ runner.arch }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
