name: 03. vars 활용
on:
  workflow_dispatch

jobs:
  use-vars:
    runs-on: ubuntu-latest
    steps:
      - name: vars 출력
        run: |
          echo "App Name: ${{ vars.APP_NAME }}"
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: dev 출력
        run: |
          echo "App Url: ${{ vars.API_URL }}"

  prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: prod 출력
        run: |
          echo "App Url: ${{ vars.API_URL }}"
